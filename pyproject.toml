[tool.poetry]
name = "gui-detector-api"
version = "0.1.0"
description = "FastAPI backend for GUI detector inference with pluggable model adapters."
authors = ["Codex <codex@openai.com>"]
readme = "README.md"
packages = [{ include = "gui_detector_api" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
pydantic = ">=2.9,<3.0"
pydantic-settings = ">=2.6,<3.0"
python-multipart = ">=0.0.9,<1.0"
pillow = ">=10.4,<12.0"
huggingface-hub = ">=0.28,<1.0"

[tool.poetry.group.models]
optional = true

[tool.poetry.group.models.dependencies]
ultralytics = ">=8.4,<9.0"
rfdetr = ">=1.5,<2.0"
transformers = ">=4.51,<5.0"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1.0"
pytest = ">=8.3,<9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: integration tests that require optional model dependencies and weight downloads",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
